; PlatformIO project for the 9x9 chessboard firmware.
; The portable game core (src/chess, variants, engine, game + include/*) is
; validated on the host by `test/tests.cpp` (see test/README or run_host_tests.sh).

[platformio]
default_envs = esp32s3

[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1       ; generic S3; adjust to your exact module
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; N16R8 = 16MB flash / 8MB PSRAM (verify your module marking!)
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
build_flags =
    -DBOARD_HAS_PSRAM
    -std=gnu++17
build_unflags = -std=gnu++11

lib_deps =
    adafruit/Adafruit NeoPixel @ ^1.12.0

; Only the ESP32 glue + core are built for the device; host-only test files
; (test/) are excluded automatically by PlatformIO's src filter.
